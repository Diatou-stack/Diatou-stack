<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="0.35" stop-color="#F472B6"/>
      <stop offset="0.7" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#818CF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.6 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .b1 { animation: f1 14s ease-in-out infinite; }
    .b2 { animation: f2 18s ease-in-out infinite; }
    .b3 { animation: f3 16s ease-in-out infinite; }
    @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(120px,40px) } }
    @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-140px,-30px) } }
    @keyframes f3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,-50px) } }

    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

    .fadein { opacity: 0; animation: in 1s ease-out forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s }
    @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }

    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s } .r3 { animation-delay: 6s } .r4 { animation-delay: 9s }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px) }
      4%   { opacity: 1; transform: translateY(0) }
      21%  { opacity: 1; transform: translateY(0) }
      25%  { opacity: 0; transform: translateY(-10px) }
      100% { opacity: 0 }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0B0D12"/>

    <!-- blobs lumineux -->
    <g filter="url(#blur)" opacity="0.55">
      <circle class="b1" cx="250" cy="90"  r="150" fill="#F472B6"/>
      <circle class="b2" cx="950" cy="260" r="170" fill="#7C3AED"/>
      <circle class="b3" cx="620" cy="320" r="120" fill="#6366F1"/>
    </g>

    <!-- grille -->
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>

  <!-- bordure -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- pill -->
  <g class="fadein d1">
    <rect x="510" y="48" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle class="dot" cx="532" cy="65" r="5" fill="#34D399"/>
    <text x="612" y="70" text-anchor="middle" font-size="14" fill="#E5E7EB" letter-spacing="1.5">DAKAR · SÉNÉGAL</text>
  </g>

  <!-- nom -->
  <text class="fadein d2" x="600" y="178" text-anchor="middle" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#name)">Diatou</text>

  <!-- rôles qui défilent -->
  <g class="mono" font-size="22" fill="#F472B6" text-anchor="middle">
    <text class="role r1" x="600" y="228">&gt; Business Analyst</text>
    <text class="role r2" x="600" y="228">&gt; Architecte Fonctionnelle</text>
    <text class="role r3" x="600" y="228">&gt; Modélisation UML · Merise</text>
    <text class="role r4" x="600" y="228">&gt; Développeuse Web</text>
  </g>

  <!-- tagline -->
  <text class="fadein d3 mono" x="600" y="290" text-anchor="middle" font-size="15" fill="#9CA3AF">
    &lt;transformer des besoins complexes en architectures logiques /&gt;
  </text>
</svg>
